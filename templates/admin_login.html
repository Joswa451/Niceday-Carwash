{% extends "base.html" %}

{% block title %}Admin Login | Nice Day Carwash{% endblock %}

{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-card">
        <span class="auth-badge">Admin</span>
        <h1>Admin portal</h1>
        <p class="auth-subtitle">Sign in with an administrator account.</p>

        <form action="{{ url_for('authentication.login_process') }}" method="POST" class="auth-form">
            <input type="hidden" name="next" value="{{ request.path }}">

            <div class="field">
                <label for="username">Admin username</label>
                <input type="text" id="username" name="user_inp" autocomplete="username" required autofocus>
            </div>

            <div class="field">
                <label for="password">Admin password</label>
                <input type="password" id="password" name="pass_inp" autocomplete="current-password" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Sign in</button>
        </form>

        <div class="auth-footer">
            <p>Are you a client? <a href="{{ url_for('authentication.login_page') }}">Client login</a></p>
            <p class="auth-muted"><a href="{{ url_for('main_pages.landing_page') }}">Back to homepage</a></p>
        </div>
    </div>
</section>
{% endblock %}
